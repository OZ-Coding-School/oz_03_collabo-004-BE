services:
  test-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py test users --noinput
    volumes:
      - ./api:/app
    environment:
      RDS_HOSTNAME: test-db
      RDS_DB_NAME: postgres
      RDS_USERNAME: test_user
      RDS_PASSWORD: test_password
      RDS_DB_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      SECRET_KEY: local-test-only-secret-key-32-bytes-minimum
    depends_on:
      test-db:
        condition: service_healthy
      redis:
        condition: service_healthy
